<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 242" width="436" height="242" role="img" aria-label="Ergo — Fully offline Flutter quiz engine powered by modular">
  <defs>
    <pattern id="vp-grid-ergo-dark" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#161E1A" stroke-width="0.65"/>
    </pattern>
    <clipPath id="vp-clip-ergo-dark">
      <rect x="18" y="38" width="400" height="90" rx="7"/>
