  <rect x="18" y="38" width="400" height="90" rx="7" fill="#F8F7F2" stroke="#BFB9A8" stroke-width="0.9"/>
  <g clip-path="url(#vp-clip-pixelforge-light)">
    <rect x="18" y="38" width="400" height="90" fill="url(#vp-grid-pixelforge-light)" opacity="0.75"/>
    
    <!-- Left Zone: 1x Low-Res Pixel Input -->
    <g>
      <rect x="42" y="54" width="14" height="14" rx="1" fill="#5C6861" opacity="0.2"/>
      <rect x="58" y="54" width="14" height="14" rx="1" fill="#5C6861" opacity="0.35"/>
      <rect x="74" y="54" width="14" height="14" rx="1" fill="#5C6861" opacity="0.55"/>
      <rect x="90" y="54" width="14" height="14" rx="1" fill="#5C6861" opacity="0.3"/>
      <rect x="106" y="54" width="14" height="14" rx="1" fill="#5C6861" opacity="0.18"/>
