<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 242" width="436" height="242" role="img" aria-label="Pixel-Forge — Offline on-device AI super-resolution &amp; face restoration">
  <defs>
    <pattern id="vp-grid-pixelforge-light" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#E7E3D7" stroke-width="0.65"/>
    </pattern>
    <clipPath id="vp-clip-pixelforge-light">
      <rect x="18" y="38" width="400" height="90" rx="7"/>
    </clipPath>
  </defs>

  <style>
    @keyframes card-led {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .cled { animation: card-led 3.2s ease-in-out infinite; }
    
    @keyframes loupe-glide {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(138px); }
    }
    .loupe { animation: loupe-glide 5.6s ease-in-out infinite; }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Card Chassis -->
  <rect x="0.75" y="0.75" width="434.5" height="240.5" rx="11" fill="#F3F1EA" stroke="#D8D4C7" stroke-width="1.15"/>
  <line x1="12" y1="1.5" x2="424" y2="1.5" stroke="rgba(255,255,255,0.85)" stroke-width="1"/>

  <!-- Header Strip -->
  <circle cx="24" cy="21" r="2.8" fill="#059669" class="cled"/>
  <text x="34" y="24" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#5C6861">SPEC.01</text>
  <text x="100" y="24" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" letter-spacing="1" fill="#929C96">// ANDROID · ON-DEVICE AI</text>
  <text x="416" y="24" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="11" fill="#059669">↗</text>

