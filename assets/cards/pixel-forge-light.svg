  <text x="20" y="195" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5C6861">with a pinch-to-zoom darkroom loupe and zero uploads.</text>

