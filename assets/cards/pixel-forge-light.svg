      <circle cx="138" cy="82" r="13" fill="#F8F7F2" fill-opacity="0.7" stroke="#059669" stroke-width="1.5"/>
      <line x1="131" y1="82" x2="145" y2="82" stroke="#E11D48" stroke-width="1"/>
      <line x1="138" y1="75" x2="138" y2="89" stroke="#E11D48" stroke-width="1"/>
