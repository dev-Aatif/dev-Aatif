      <rect x="58" y="70" width="14" height="14" rx="1" fill="#5C6861" opacity="0.65"/>
      <rect x="74" y="70" width="14" height="14" rx="1" fill="#5C6861" opacity="0.85"/>
      <rect x="90" y="70" width="14" height="14" rx="1" fill="#5C6861" opacity="0.52"/>
      <rect x="106" y="70" width="14" height="14" rx="1" fill="#5C6861" opacity="0.26"/>
