  <text x="20" y="227" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" letter-spacing="0.9" fill="#929C96">KOTLIN · JETPACK COMPOSE · NCNN VULKAN · ONNX RUNTIME</text>
