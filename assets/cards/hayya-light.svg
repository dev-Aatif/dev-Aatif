<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 242" width="436" height="242" role="img" aria-label="Hayya — Zero-permission Islamic prayer reminder &amp; companion">
  <defs>
    <pattern id="vp-grid-hayya-light" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#E7E3D7" stroke-width="0.65"/>
    </pattern>
    <clipPath id="vp-clip-hayya-light">
      <rect x="18" y="38" width="400" height="90" rx="7"/>
    </clipPath>
  </defs>

  <style>
    @keyframes card-led {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .cled { animation: card-led 3.2s ease-in-out infinite; }
    
    @keyframes compass-sway {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes sun-pulse {
      0%, 100% { r: 4.5px; opacity: 1; }
      50% { r: 6.2px; opacity: 0.75; }
    }
    .qibla-needle {
      transform-origin: 348px 84px;
      animation: compass-sway 5.2s ease-in-out infinite;
    }
    .solar-orb { animation: sun-pulse 3s ease-in-out infinite; }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Card Chassis -->
  <rect x="0.75" y="0.75" width="434.5" height="240.5" rx="11" fill="#F3F1EA" stroke="#D8D4C7" stroke-width="1.15"/>
  <line x1="12" y1="1.5" x2="424" y2="1.5" stroke="rgba(255,255,255,0.85)" stroke-width="1"/>

  <!-- Header Strip -->
  <circle cx="24" cy="21" r="2.8" fill="#059669" class="cled"/>
  <text x="34" y="24" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#5C6861">SPEC.03</text>
  <text x="100" y="24" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" letter-spacing="1" fill="#929C96">// ANDROID · ZERO-TELEMETRY</text>
  <text x="416" y="24" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="11" fill="#059669">↗</text>

  <!-- Panoramic Kinetic Instrument Viewport (18, 38, 400 x 90) -->
  <rect x="18" y="38" width="400" height="90" rx="7" fill="#F8F7F2" stroke="#BFB9A8" stroke-width="0.9"/>
  <g clip-path="url(#vp-clip-hayya-light)">
    <rect x="18" y="38" width="400" height="90" fill="url(#vp-grid-hayya-light)" opacity="0.75"/>
    
    <!-- Horizon Line -->
    <line x1="34" y1="106" x2="278" y2="106" stroke="#BFB9A8" stroke-width="1"/>
    <!-- Parabolic Solar Arc (Jean Meeus Solver) -->
    <path d="M 46 106 Q 156 24 266 106" fill="none" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 3"/>
    <!-- Prayer Time Nodes along Solar Arc -->
    <circle cx="58" cy="96" r="2.2" fill="#5C6861"/>
    <circle cx="104" cy="70" r="2.2" fill="#5C6861"/>
    <circle cx="156" cy="59" r="2.5" fill="#B45309"/>
    <circle cx="208" cy="70" r="2.2" fill="#5C6861"/>
    <circle cx="254" cy="96" r="2.2" fill="#5C6861"/>

    <!-- Glowing Sun Animated along the Solar Path via SMIL -->
    <circle r="10" fill="rgba(180,83,9,0.14)">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 46,106 Q 156,24 266,106"/>
    </circle>
    <circle r="4.5" fill="#B45309" class="solar-orb">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 46,106 Q 156,24 266,106"/>
    </circle>

    <text x="34" y="53" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" letter-spacing="1" fill="#059669">DUAL SOLAR SOLVER</text>
    <text x="34" y="120" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="7.5" fill="#929C96">FAJR · DHUHR · ASR · MAGHRIB · ISHA</text>

    <!-- Mini Qibla Compass Rose on Right (cx=348, cy=84) -->
    <circle cx="348" cy="84" r="28" fill="#F3F1EA" stroke="#BFB9A8" stroke-width="1"/>
    <circle cx="348" cy="84" r="21" fill="none" stroke="#D8D4C7" stroke-width="0.7" stroke-dasharray="2 3"/>
    <text x="348" y="64" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="7" fill="#929C96">N</text>
    <g class="qibla-needle">
      <polygon points="348,66 352,84 348,80 344,84" fill="#059669"/>
      <polygon points="348,102 351,84 348,88 345,84" fill="#929C96"/>
      <circle cx="348" cy="84" r="2.2" fill="#141A17"/>
    </g>
    <text x="348" y="122" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="7.5" fill="#5C6861">QIBLA</text>
    
  </g>

  <!-- Title & Concise Engineering Description -->
  <text x="20" y="159" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" letter-spacing="-0.25" fill="#141A17">Hayya</text>
  <rect x="324" y="144" width="94" height="19" rx="4" fill="rgba(5,150,105,0.10)" stroke="#059669" stroke-width="0.75"/><text x="371.0" y="156.5" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8.5" font-weight="600" letter-spacing="0.8" fill="#059669">100% OFFLINE</text>
  <text x="20" y="179" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5C6861">Zero-permission Islamic prayer reminder &amp; companion</text>
  <text x="20" y="195" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5C6861">with Doze-resilient alarms, Glance widgets &amp; Qibla.</text>

  <!-- Bottom Stack Calibration Footer -->
  <line x1="18" y1="210" x2="418" y2="210" stroke="#D8D4C7" stroke-width="0.85"/>
  <text x="20" y="227" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" letter-spacing="0.9" fill="#929C96">KOTLIN · JETPACK COMPOSE · GLANCE · JEAN MEEUS</text>
</svg>
