<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" role="img" aria-label="Aatif — Built with restraint. Engineered to endure.">
  <defs>
    <pattern id="hero-grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161E1A" stroke-width="0.75"/>
    </pattern>

    <radialGradient id="dial-glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#34D399" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shimmer-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="45%" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#F1F5F3" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="wordmark-clip-dark">
      
    <g transform="translate(48,108)">
      <path d="M 0,76 L 26,0 L 38,0 L 64,76 L 50,76 L 44,57 L 20,57 L 14,76 Z M 23.5,45.5 L 40.5,45.5 L 32,19 Z" fill-rule="evenodd"/>
      <path d="M 0,76 L 26,0 L 38,0 L 64,76 L 50,76 L 44,57 L 20,57 L 14,76 Z M 23.5,45.5 L 40.5,45.5 L 32,19 Z" transform="translate(74,0)" fill-rule="evenodd"/>
