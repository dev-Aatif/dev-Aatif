    <circle cx="726" cy="182" r="165" fill="url(#dial-glow-dark)"/>
    <!-- Top specular bevel -->
    <line x1="14" y1="1.5" x2="886" y2="1.5" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

