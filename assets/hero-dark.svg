      <text x="726" y="314" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8.5" letter-spacing="1" fill="#47554E">180°</text>
      <text x="600" y="185" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8.5" letter-spacing="1" fill="#47554E">270°</text>
    </g>

    <!-- Sonar / Optical Calibration Pulse -->
    <circle cx="726" cy="182" r="10" fill="none" stroke="#34D399" stroke-width="1.2" class="pulse-ring"/>

    <!-- Ring 1: Slow Clockwise Solar Azimuth Track (Hayya nod) -->
    <g class="ring-cw">
      <circle cx="726" cy="182" r="84" fill="none" stroke="#34D399" stroke-width="1.1" stroke-dasharray="36 18 8 18 96 40" opacity="0.75"/>
      <!-- Amber Solar Zenith Node -->
      <circle cx="726" cy="98" r="4.2" fill="#F59E0B"/>
      <circle cx="726" cy="98" r="8.5" fill="rgba(245,158,11,0.16)"/>
      <!-- Opposite Calibration Pip -->
      <rect x="723.5" y="263.5" width="5" height="5" fill="#34D399" transform="rotate(45 726 266)"/>
    </g>

    <!-- Ring 2: Counter-Clockwise Darkroom Optical Aperture (Pixel-Forge nod) -->
    <g class="ring-ccw">
      <circle cx="726" cy="182" r="52" fill="none" stroke="#B7C4BD" stroke-width="1.4" stroke-dasharray="48 60 22 60" opacity="0.55"/>
      <circle cx="778" cy="182" r="3" fill="#FB7185"/>
      <line x1="669" y1="182" x2="680" y2="182" stroke="#34D399" stroke-width="1.8"/>
    </g>

    <!-- Ring 3: Fast Inner Sweeping Hand -->
    <g class="ring-fast">
      <line x1="726" y1="196" x2="726" y2="138" stroke="#34D399" stroke-width="1.35" stroke-linecap="round"/>
      <circle cx="726" cy="138" r="2.2" fill="#34D399"/>
    </g>

    <!-- Central Aperture Reticle -->
    <polygon points="726,171 737,182 726,193 715,182" fill="#0F1412" stroke="#34D399" stroke-width="1.2"/>
    <circle cx="726" cy="182" r="3.2" fill="#34D399"/>

    <!-- Micro Label under Instrument -->
    <text x="726" y="330" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8.5" letter-spacing="1.6" fill="#47554E">CALIBRATED · PURE VECTOR</text>
  </g>
</svg>
