    <text x="64" y="250" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="11" fill="#7C8C84">Calm software that respects the machine — online or off the grid.</text>
